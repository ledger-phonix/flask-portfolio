<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Portfolio</title>
    <link rel="icon" type="image/png" href="{{url_for('static',filename='img/portfolio-logo.png')}}">
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind-built.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0f172a] text-slate-200">

    <div class="min-h-screen flex flex-col items-center justify-center px-4">
        
        <div class="w-full max-w-md mb-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="p-4 rounded-xl bg-rose-500/20 text-rose-400 border border-rose-500/50 text-sm mb-2">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <div class="w-full max-w-md bg-[#1e293b] border border-slate-700 p-8 rounded-2xl shadow-2xl">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600/10 rounded-full mb-4">
                    <i class="fa-solid fa-shield-halved text-blue-500 text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Admin Access</h2>
                <p class="text-slate-400 text-sm mt-2">Enter your secure credentials</p>
            </div>

            <form method="POST" action="{{ url_for('admin.login') }}" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                            <i class="fa-solid fa-user"></i>
                        </span>
                        <input type="text" name="username" required
                               class="w-full pl-10 pr-4 py-2.5 bg-[#0f172a] border border-slate-600 rounded-xl text-white focus:border-blue-500 focus:outline-none transition-all"
                               placeholder="Admin username">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-500">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" name="password" required
                               class="w-full pl-10 pr-4 py-2.5 bg-[#0f172a] border border-slate-600 rounded-xl text-white focus:border-blue-500 focus:outline-none transition-all"
                               placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all transform active:scale-95 shadow-lg shadow-blue-600/20">
                    Sign In
                </button>
            </form>

            <div class="mt-8 text-center">
                <a href="{{ url_for('main.index') }}" class="text-sm text-slate-500 hover:text-slate-300 transition-colors" target="_blank" rel="noopener noreferrer">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Return to Site
                </a>
            </div>
        </div>
    </div>

</body>
</html>
